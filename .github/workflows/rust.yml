name: Rust CI

# This workflow owns the required status checks (rust-msrv, rust-client,
# release-secret-scan, license-admin). It must therefore run for every push
# and pull request: a skipped *workflow* leaves required checks Pending and
# blocks merging, while individual expensive steps are made conditional below.
# Do not add path/branch allowlists at the workflow level.
on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-msrv:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.90.0"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: .

      - name: Check minimum supported Rust
        run: cargo check --locked

  rust-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check source hygiene
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: .\tools\check-source-hygiene.ps1

      - name: Fail on committed release binaries
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          if (Test-Path $dist) {
            $executables = Get-ChildItem -Path $dist -Filter *.exe -File
            if ($executables) {
              $names = ($executables | Select-Object -ExpandProperty Name) -join ', '
              throw "Remove committed executables from dist before merging: $names"
            }
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Windows dependency graph
        shell: pwsh
        run: .\scripts\audit-windows.ps1

      - name: Validate release and E2E PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "tools\release\sign-and-package.ps1",
            "tools\check-source-hygiene.ps1",
            "tools\e2e\staging-e2e.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script:$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell parse errors in $script"
            }
            Write-Output "Parsed OK: $script"
          }

      - name: Credential-free packaging smoke (Candle + Light)
        shell: pwsh
        run: .\tools\release\sign-and-package.ps1 -SmokeTest

  release-secret-scan:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: .

      - name: Build release client with sentinel secrets
        shell: pwsh
        env:
          HEAT3_KEYGEN_ADMIN_TOKEN: "__HEAT3_CI_SECRET_SENTINEL__"
          HEAT3_KEYGEN_PRODUCT_TOKEN: "__HEAT3_CI_SECRET_SENTINEL__"
          HEAT3_DEV_LICENSE: "__HEAT3_CI_DEV_LICENSE_SENTINEL__"
        run: cargo build --release --locked

      - name: Verify the development license bypass is disabled in release builds
        shell: pwsh
        env:
          HEAT3_DEV_LICENSE: "__HEAT3_CI_DEV_LICENSE_SENTINEL__"
        run: cargo test --release --locked development_license_bypass_is_disabled_in_release

      - name: Fail if a secret is embedded in the client binary
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'target\release\heat3_povorotnik.exe'
          $bytes = [IO.File]::ReadAllBytes($binary)
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          $sentinel = '__HEAT3_CI_SECRET_SENTINEL__'
          if ($text.Contains($sentinel)) {
            throw "Admin/product token leaked into the client binary."
          }
          $devLicenseSentinel = '__HEAT3_CI_DEV_LICENSE_SENTINEL__'
          if ($text.Contains($devLicenseSentinel)) {
            throw "Development license bypass leaked into the client binary."
          }
          Write-Output "No embedded secrets in the client binary."

  release-sign:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [rust-client, release-secret-scan]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    # Only public Keygen configuration is exposed here. The signing secrets are
    # scoped to the single signing step below so checkout, toolchain, cache and
    # cargo build / build scripts never run with the certificate present.
    env:
      HEAT3_KEYGEN_API_URL: ${{ vars.HEAT3_KEYGEN_API_URL }}
      HEAT3_KEYGEN_ACCOUNT_ID: ${{ vars.HEAT3_KEYGEN_ACCOUNT_ID }}
      HEAT3_KEYGEN_PRODUCT_ID: ${{ vars.HEAT3_KEYGEN_PRODUCT_ID }}
      HEAT3_KEYGEN_POLICY_ID: ${{ vars.HEAT3_KEYGEN_POLICY_ID }}
      HEAT3_KEYGEN_PUBLIC_KEY: ${{ vars.HEAT3_KEYGEN_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: .

      - name: Require release configuration
        shell: pwsh
        run: |
          $requiredKeygenVariables = "HEAT3_KEYGEN_API_URL", "HEAT3_KEYGEN_ACCOUNT_ID", "HEAT3_KEYGEN_PRODUCT_ID", "HEAT3_KEYGEN_POLICY_ID", "HEAT3_KEYGEN_PUBLIC_KEY"
          foreach ($variable in $requiredKeygenVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($variable))) {
              throw "Trusted release build requires the GitHub variable $variable."
            }
          }

      # A tag name alone is not a source trust boundary: only commits contained
      # in the protected release branch may be signed.
      - name: Verify the signed commit belongs to the protected release branch
        shell: pwsh
        run: |
          git fetch origin main --no-tags --depth=1
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $env:GITHUB_SHA is not contained in the protected release branch (origin/main); refusing to sign."
          }
          Write-Output "Containment check: $env:GITHUB_SHA is an ancestor of origin/main"

      - name: Enforce release version matches Cargo and tag
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -LiteralPath "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value.Trim()
          $refName = $env:GITHUB_REF_NAME
          if ($refName -and $refName.StartsWith("v")) {
            $tagVersion = $refName.Substring(1)
            if ($tagVersion -ne $cargoVersion) {
              throw "Tag $refName does not match Cargo version $cargoVersion — update Cargo.toml or tag before release."
            }
            Write-Output "Version check: tag $refName matches Cargo $cargoVersion"
          } else {
            Write-Output "Version check: non-tag build, Cargo $cargoVersion"
          }
          if (-not (Select-String -LiteralPath "src/ui2/platform.rs" -Pattern 'env!\("CARGO_PKG_VERSION"\)')) {
            throw "WINDOW_TITLE must derive from env!(""CARGO_PKG_VERSION"")"
          }

      - name: Build and verify release client configuration
        shell: pwsh
        run: |
          cargo build --release --locked
          cargo test --release --locked release_compile_time_configuration_is_valid

      - name: Sign and package the release
        shell: pwsh
        env:
          HEAT3_CODESIGN_CERT_BASE64: ${{ secrets.HEAT3_CODESIGN_CERT_BASE64 }}
          HEAT3_CODESIGN_CERT_PASSWORD: ${{ secrets.HEAT3_CODESIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEAT3_CODESIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:HEAT3_CODESIGN_CERT_PASSWORD)) {
            throw "Trusted release signing requires HEAT3_CODESIGN_CERT_BASE64 and HEAT3_CODESIGN_CERT_PASSWORD."
          }
          .\tools\release\sign-and-package.ps1 -RequireMsi

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heat3-povorotnik-release
          path: dist/*

  license-admin:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/license-admin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: tools/license-admin

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
